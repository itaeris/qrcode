name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-qrcode
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  IMAGE: itaeris/qrcode_app

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PROD_ENV: ${{ secrets.PROD_ENV }}
          IMAGE: ${{ env.IMAGE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script_stop: true
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,PROD_ENV,IMAGE
          script: |
            set -eu
            if [ -z "$PROD_ENV" ]; then
              echo "PROD_ENV kosong"
              exit 1
            fi
            if ! docker network inspect qrcode-network >/dev/null 2>&1; then
              echo "Network qrcode-network tidak ditemukan"
              exit 1
            fi
            mkdir -p /opt/qrcode
            umask 077
            printf '%s\n' "$PROD_ENV" > /opt/qrcode/.env
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            if docker ps -a --format '{{.Names}}' | grep -qx qrcode_app; then
              docker stop qrcode_app
              docker rm qrcode_app
            fi
            docker rmi "$IMAGE:latest" || true
            docker pull "$IMAGE:latest"
            docker run -d \
              --name qrcode_app \
              --restart unless-stopped \
              --network qrcode-network \
              -p 2323:80 \
              -v qrcode_storage:/var/www/html/storage \
              --env-file /opt/qrcode/.env \
              "$IMAGE:latest"
            docker logout
            docker image prune -f
